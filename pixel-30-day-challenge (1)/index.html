<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel 30 Day Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              'pixel': ['"Press Start 2P"', 'cursive'],
              'retro': ['"VT323"', 'monospace'],
            },
            colors: {
              'anime-bg': '#FFF0F5', // Lavender Blush
              'anime-pink': '#FF99C8',
              'anime-purple': '#D0A9F5',
              'anime-blue': '#A0E7E5',
              'anime-cream': '#FFF5E4',
              'anime-text': '#4A4E69',
              'pixel-accent': '#FF69B4', // Hot Pink
            },
            boxShadow: {
              'pixel': '4px 4px 0px 0px rgba(74, 78, 105, 0.2)',
              'pixel-sm': '2px 2px 0px 0px rgba(74, 78, 105, 0.2)',
              'pixel-lg': '8px 8px 0px 0px rgba(74, 78, 105, 0.15)',
              'pixel-hard': '4px 4px 0px 0px #4A4E69',
              'title': '6px 6px 0px 0px #4A4E69',
            },
            animation: {
              'bounce-slow': 'bounce 3s infinite',
              'float': 'float 3s ease-in-out infinite',
              'float-slow': 'float 6s ease-in-out infinite',
              'float-reverse': 'floatReverse 7s ease-in-out infinite',
              'drift': 'drift 20s linear infinite',
              'spin-slow': 'spin 3s linear infinite',
              'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              floatReverse: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(20px)' },
              },
              drift: {
                '0%': { transform: 'translateX(-5%) rotate(0deg)' },
                '50%': { transform: 'translateX(5%) rotate(5deg)' },
                '100%': { transform: 'translateX(-5%) rotate(0deg)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background: linear-gradient(135deg, #FFF0F5 0%, #F8E8EE 25%, #E6E6FA 50%, #E0FFFF 75%, #FFF0F5 100%);
        background-attachment: fixed;
        min-height: 100vh;
        overflow-x: hidden;
      }
      
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: 
          linear-gradient(rgba(255, 153, 200, 0.1) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 153, 200, 0.1) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
        z-index: -1;
      }

      ::-webkit-scrollbar {
        width: 12px;
      }
      ::-webkit-scrollbar-track {
        background: #FFF5E4; 
      }
      ::-webkit-scrollbar-thumb {
        background: #FF99C8; 
        border: 2px solid #FFF5E4;
        border-radius: 6px;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "vite": "https://aistudiocdn.com/vite@^7.2.4",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
    "express": "https://esm.sh/express@^5.2.1",
    "mongoose": "https://esm.sh/mongoose@^9.1.2",
    "cors": "https://esm.sh/cors@^2.8.5"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
